<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-Application</title>
    <style>
        body{
            background-color: mediumseagreen;
        }
        #id-1>form{
            background-color: white;
        }
        label{
            text-align: center;
        }
    </style>
</head>
<body>
    <div id ="id-1">
        <form action="POST">
            <label>
                Enter your task <br>
            </label>
            <input type="text" placeholder="eg:Read Books etc,.">
            <button>Add to task</button>
        </form>
    </div>
</body>
</html>
