<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-app</title>
    <style>
        body{
            background-color: rgb(138, 193, 193);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin: 0%;
            padding: 20px;
        }

        .Contrainer1{
            background-color: rgb(15, 85, 80);
            height: 200px;
            width: 600px;
        }

        h1 {
            text-align: center;
            color: #140808;
        }

        .container2{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .container2 input,
        .container2 select,
        .container2 button{
             flex: 1 1 180px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            box-sizing: border-box;
        }
        table{
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
        }

        
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
            font-size: 14px;
        }

        .rowname{
            padding-top: 50px;
            display: flex;
            justify-content: center;
           

        }
        .btn{
            background-color: rgb(244, 245, 250);
            border-radius: 5px;
        }
        .btn:hover{
            background-color: rgb(251, 107, 107);
        }
        .actions button {
            margin: 0 2px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }

            .form-row input,
            .form-row select,
            .form-row button {
                width: 100%;
            }

            th, td {
                font-size: 12px;
            }                                                                                                                                                                                                                                                                                                                                                                       
            
        }

        @media (max-width: 480px) {
            th, td {
                padding: 8px;
            }

            h1 {
                font-size: 24px;
            }
        }

    </style>
</head>
<body>
   <center>
     <div class="Contrainer1">
        <h1>To-Do-Application</h1>
        <div id="container2">
        <input type="text" id="taskname" placeholder="Task Name">
        <select id="priority">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <input type="date" id="startdate">
        <input type="date" id="endate">
        <button class="btn" onclick="add_fun()"> Add Task</button>
        <!-- <button onclick=""></button> -->

        </div>

        <div class="rowname">
            <table border="1">
                <thead>
                    <tr>
                        <th>Task Name</th>
                        <th>Start Date</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="Tasktablebody"></tbody>
            </table>
        </div>
    </div>

   </center>
    <script>
        function add_fun(){
            const taskname = document.getElementById("taskname").value.trim();
            const priority = document.getElementById("priority").value
            const startdate = document.getElementById("startdate").value
            const endate = document.getElementById("endate").value
        

        if (!taskname ||!startdate || !endate ){
            alert("Please fill the required details")
            return
        }

        const tablebody = document.getElementById("Tasktablebody")
        const row = document.createElement('tr');

        row.innerHTML = `
        <td><span>${taskname} </span> </td>
        <td><input type="date" value="${startdate}" disabled></td>
                <td><input type="date" value="${endate}" disabled></td>
                <td>
                    <select disabled>
                        <option value="High" ${priority === 'High' ? 'selected' : ''}>High</option>
                        <option value="Medium" ${priority === 'Medium' ? 'selected' : ''}>Medium</option>
                        <option value="Low" ${priority === 'Low' ? 'selected' : ''}>Low</option>
                    </select>
                </td>
                 <td>
                    <select disabled>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </td>
                <td class ="action">
                    <button onclick="enableEdit(this)">Edit</button>
                    <button onclick ="deletetMethod(this)">Delete </button>
                </td>
            `;
                tablebody.appendChild(row);

                document.getElementById('taskname').value = '';
                document.getElementById('priority').value = 'Medium';
                document.getElementById('startdate').value = '';
                document.getElementById('endate').value = '';

            }

            function deletetMethod(btn){
                const row = btn.parentNode.parentNode;
                row.remove();
            }

            function enableEdit(btn){
                const row = btn.parentNode.parentNode;
                const span = row.querySelector('td span');
                const startInput = row.cells[1].querySelector('input');
                const dueInput = row.cells[2].querySelector('input');
                const selects = row.querySelectorAll('td select');

                if (btn.textContent === 'Edit') {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = span.textContent;
                    span.replaceWith(input);

                    startInput.disabled = false;
                    dueInput.disabled = false;
                    selects.forEach(select => select.disabled = false);
                    btn.textContent = 'Save';
                } else {
                    const input = row.querySelector('td input[type="text"]');
                    const newSpan = document.createElement('span');
                    newSpan.textContent = input.value;
                    input.replaceWith(newSpan);

                    startInput.disabled = true;
                    dueInput.disabled = true;
                    selects.forEach(select => select.disabled = true);
                    btn.textContent = 'Edit';
                }
            }
        </script>
</body>
</html>
